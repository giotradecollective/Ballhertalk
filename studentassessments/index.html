<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student Assessment | Giotrade Group</title>
<style>
:root{--bg:#ffffff;--fg:#111111;--muted:#5a5a5a;--card:#f4f4f4;--line:#dcdcdc;--accent:#d62839;--warn:#b45309;--ok:#2f6f2e;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0b0d;--fg:#f2f2f2;--muted:#a8a8a8;--card:#17171a;--line:#2b2b30;--warn:#f59e0b;--ok:#7fb77e}}
:root[data-theme="dark"]{--bg:#0b0b0d;--fg:#f2f2f2;--muted:#a8a8a8;--card:#17171a;--line:#2b2b30;--warn:#f59e0b;--ok:#7fb77e}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:24px 16px 80px}
h1{font-size:1.7rem;margin:0 0 2px}
h2{font-size:1.25rem;margin:0 0 8px}
.sub{color:var(--accent);font-weight:600;margin:0 0 20px}
.card{background:var(--card);border-radius:12px;padding:20px;margin-bottom:16px}
.muted{color:var(--muted)}
button,.btn{font:inherit;background:var(--accent);color:#fff;border:0;border-radius:8px;padding:12px 20px;font-weight:600;cursor:pointer}
button.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
button:disabled{opacity:.5;cursor:default}
input[type=text]{font:inherit;width:100%;padding:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);text-transform:uppercase;letter-spacing:.08em}
textarea{font:inherit;width:100%;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--fg);resize:vertical;min-height:70px}
.bar{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:2px solid var(--accent);padding:10px 16px;padding-top:calc(10px + env(safe-area-inset-top,0px));display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar .t{font-variant-numeric:tabular-nums;font-size:1.5rem;font-weight:700}
.bar .t.warn{color:var(--warn)}
.bar .t.crit{color:var(--accent)}
.status{font-size:.8rem;color:var(--muted)}
fieldset{border:0;padding:0;margin:0 0 22px}
legend{font-weight:600;padding:0;margin-bottom:8px}
.opt{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin:6px 0;cursor:pointer}
.opt:has(input:checked){border-color:var(--accent);background:var(--card)}
.opt input{margin-top:5px}
.fig{max-width:100%;height:auto;display:block;margin:6px 0 12px;border:1px solid var(--line);border-radius:8px;background:#fff}
.q{margin-bottom:22px}
.part{margin:10px 0 4px;font-weight:500}
.marks{color:var(--muted);font-weight:400;font-size:.9rem}
.err{color:var(--accent);margin-top:10px}
table{border-collapse:collapse;width:100%}
td,th{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.reminder{border-left:4px solid var(--accent)}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* ====== SETUP: paste your two Supabase values here ====== */
const SUPABASE_URL = "https://vsjpjnyjjxdyijooesfl.supabase.co";      // e.g. https://abcdxyz.supabase.co
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzanBqbnlqanhkeWlqb29lc2ZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTU2MDc1NTEsImV4cCI6MjExMTE4MzU1MX0.-zXW08q5CXSQIeySDaqqPWSfBnOgE38ODfM6f8dwZ_4";  // the public "anon" key (safe to publish)
/* ======================================================== */

const META = {
  a:{title:"Section A: Multiple Choice", mins:20, info:"19 questions · 38 marks"},
  b:{title:"Section B: Short Answers", mins:25, info:"8 questions · best 7 count · 35 marks"},
  c:{title:"Section C: Applied Scenarios and Bonus", mins:20, info:"2 scenarios · 20 marks + 5 bonus"}
};
const SEC_ORDER=["a","b","c"];

const A = [
 {n:1,q:"Equities (shares) represent:",o:["A loan to a company","Ownership in a company","A promise to pay interest","A contract to buy a commodity later"]},
 {n:2,q:"When interest rates rise, bond prices generally:",o:["Rise","Stay the same","Fall","Double"]},
 {n:3,q:"Which statement about synthetic RNG assets is TRUE?",o:["They are tied to a real company’s earnings","They only trade during London hours","They are algorithm-generated, so real-world fundamental news does not apply","They cannot be traded with stop losses"]},
 {n:4,q:"At the Range High, which statement matches the lesson?",o:["Buyer interest increases and seller interest decreases","Buyer interest decreases and seller interest increases (Demand < Supply)","Buyers and sellers are perfectly equal","Price cannot go higher under any circumstance"],img:"fig1_range.png",alt:"Range chart for A4 to A6"},
 {n:5,q:"A range runs from R10 (low) to R20 (high). Market Equilibrium is:",o:["R12.50","R14","R15","R17.50"]},
 {n:6,q:"Price trading ABOVE the equilibrium of a range is in:",o:["Discount","Premium","Value","Liquidity"]},
 {n:7,q:"In an upward trend, range A–B runs from 100 (A) to 200 (B), so the 50% level is 150. Which pullback low (C) satisfies the structure rule while keeping the trend intact?",o:["160","155","120","95"],img:"fig2_up.png",alt:"Upward trend chart for A7"},
 {n:8,q:"In a downward trend, range A–B runs from 200 (A) to 100 (B), so the 50% level is 150. Which retracement high (C) satisfies the mirrored rule?",o:["130","145","170","205"],img:"fig3_down.png",alt:"Downward trend chart for A8"},
 {n:9,q:"Why do we aim to buy at discount and sell at premium?",o:["Because discount prices are always the lowest of the day","Because it gives a better price relative to fair value (the equilibrium)","Because indicators only work there","Because brokers charge less spread there"]},
 {n:10,q:"In the liquidity lessons, “liquidity” sitting above equal highs is made up of:",o:["Stop losses from sellers + breakout buyers","Only take-profit orders","Only market makers’ inventory","Dividend payments"],img:"fig4_liq.png",alt:"Price at premium chart for A10 and A11"},
 {n:11,q:"At premium, price builds equal highs, then pushes just above them into a high volume area, then falls. This is best described as:",o:["A failed trend","Liquidity being taken at premium, followed by a move down","A discount buying opportunity","Random noise"]},
 {n:12,q:"How are the higher timeframe (H4) and lower timeframe (M30) used together in the lessons?",o:["H4 finds the high volume area; M30 shows the liquidity and timing for the entry","M30 decides the trend; H4 is ignored","They must always show the same pattern","H4 is only for news; M30 is only for volume"],img:"fig5_tf.png",alt:"H4 and M30 charts for A12"},
 {n:13,q:"A high volume area is:",o:["A zone where very little trading occurred","A zone where a large amount of trading occurred and buyers and sellers both see fair value","The Range High only","Any area above equilibrium"]},
 {n:14,q:"A low volume area is:",o:["A zone where very little trading activity or liquidity occurred","A zone where price spent the most time","The Point of Control","Always found at discount"]},
 {n:15,q:"The POC (Point of Control) is:",o:["The highest price in the range","The price level with the highest traded volume","The lowest price in the range","The 50% level of the range"],img:"fig6_profile.png",alt:"Volume profile for A15 and A16"},
 {n:16,q:"The Value Area represents approximately what share of total traded volume?",o:["30%","50%","70%","100%"]},
 {n:17,q:"In an uptrend, our best buying opportunities come from:",o:["Premium low volume areas","Discount high volume areas","The Range High","Any level after a breakout"],img:"fig7_zones.png",alt:"Uptrend zones for A17 and A18"},
 {n:18,q:"According to the lesson, buying at a low volume area (especially above equilibrium) should be disregarded because:",o:["Brokers block those orders","They get eliminated about 89% of the time as price searches for better, cheaper prices","Low volume means the trend is over","They only work on M30"]},
 {n:19,q:"On the Advanced Analysis chart (downward market), price retraces into premium, re-enters the value area and rejects the POC at a high volume area. The lesson’s approach is to:",o:["Buy because price is above equilibrium","Do nothing, because POC never matters","Sell on confirmed rejection, targeting the VAL first and then the Range Low","Buy the VAL immediately"],img:"fig8_poc.png",alt:"Downward market chart for A19"}
];

const B = [
 {t:"B1.",q:"In your own words, explain Range High, Range Low and Equilibrium. What is happening between buyers and sellers at each?",m:5,p:[{id:"B1",r:6}]},
 {t:"B2.",q:"A range runs from R100 to R180.",m:5,p:[{id:"B2a",s:"(a) Calculate the equilibrium.",r:2},{id:"B2b",s:"(b) State the premium zone and the discount zone.",r:3}]},
 {t:"B3.",q:"Explain why, in an upward trend, each pullback should reach at least below 50% of the previous range. Hint: think about price relative to fair value.",m:5,p:[{id:"B3",r:5}]},
 {t:"B4.",q:"What two groups of orders make up liquidity above equal highs, and why does price often travel to take them?",m:5,p:[{id:"B4",r:5}]},
 {t:"B5.",q:"Compare a high volume area and a low volume area in terms of how buyers and sellers see value. Why does price tend to move quickly through low volume areas?",m:5,p:[{id:"B5",r:6}]},
 {t:"B6.",q:"Define POC, Value Area High (VAH) and Value Area Low (VAL). What does the Value Area tell a trader?",m:5,p:[{id:"B6",r:6}]},
 {t:"B7.",q:"The lesson “Rejection of VAL + High Volume at Discount” calls it the best buying opportunity. Explain why, using the words equilibrium, value and discount.",m:5,p:[{id:"B7",r:6}]},
 {t:"B8.",q:"Asset class maths. Hint: interest = $10,000 × 6% × 5.",m:5,p:[{id:"B8a",s:"(a) You buy 100 shares at $50. After 5 years the price is $100 and you received $500 in dividends. Calculate total return in $ and %.",r:3},{id:"B8b",s:"(b) A $10,000 bond pays a 6% annual coupon for 5 years. Calculate total interest received and total cash flow including principal.",r:3}]}
];

const C = [
 {t:"C1. Downward market: reading the profile.",q:"A price chart has: Range High 1.2040, Range Low 1.1404, POC 1.1795, VAH 1.2005, VAL 1.1625. The market was trending down, then rallied back into premium, re-entered the value area and reached the POC, sitting in a high volume area. Price then spikes above the POC and closes back below it.",
  p:[{id:"C1a",s:"(a) Calculate the equilibrium. (2 marks)",r:2},{id:"C1b",s:"(b) Is the POC in premium or discount? Justify. (2 marks)",r:3},{id:"C1c",s:"(c) What is your bias (buy, sell or wait) and why? (3 marks)",r:4},{id:"C1d",s:"(d) State your first and final targets. (3 marks)",r:3}]},
 {t:"C2. Two premium sells: which is better?",q:"Chart X: price reaches premium, sweeps equal highs inside a premium high volume area and reverses sharply. Chart Y: price reaches premium too, but on a low volume area.",
  p:[{id:"C2a",s:"(a) Which would you trade and which would you avoid? (4 marks)",r:3},{id:"C2b",s:"(b) Explain the reasoning, including the 89% statistic. (6 marks)",r:6}]},
 {t:"Bonus (5 marks)",q:"A trader sees price at premium in an uptrend and buys at a low volume area because “momentum is strong”. Explain what the lessons say about this trade and how he could improve his entry.",p:[{id:"Bonus",r:6}]}
];

const $app=document.getElementById("app");
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
let token=null,cur=null,answers={},deadline=0,tick=null,auto=null,debounce=null,saving=false,closing=false;

try{token=localStorage.getItem("giotrade_token")}catch(e){}

async function rpc(fn,args){
  const r=await fetch(SUPABASE_URL+"/rest/v1/rpc/"+fn,{method:"POST",
    headers:{"Content-Type":"application/json",apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY},
    body:JSON.stringify(args)});
  let j=null;try{j=await r.json()}catch(e){}
  if(!r.ok)throw new Error((j&&j.message)||"Request failed");
  return j;
}
function clearTimers(){clearInterval(tick);clearInterval(auto);clearTimeout(debounce);tick=auto=debounce=null}
function mmss(s){s=Math.max(0,Math.ceil(s));return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0")}

/* ---------- views ---------- */
function viewSetup(){
  $app.innerHTML=`<main><h1>Setup needed</h1><div class="card"><p>Open <b>index.html</b> and paste your Supabase project URL and anon key at the top of the script.</p></div></main>`;
}
function viewLogin(msg){
  clearTimers();
  $app.innerHTML=`<main>
  <h1>Student Assessment</h1><p class="sub">Giotrade Group · Structure, Premium/Discount &amp; Volume</p>
  <div class="card">
    <h2>Enter your access code</h2>
    <p class="muted">Your tutor gave you a personal code. It can only be used once.</p>
    <input id="code" type="text" autocomplete="off" autocapitalize="characters" placeholder="ACCESS CODE" maxlength="20">
    <p class="err" id="err">${msg?esc(msg):""}</p>
    <p><button id="go">Continue</button></p>
  </div></main>`;
  const go=async()=>{
    const code=document.getElementById("code").value.trim();
    if(!code)return;
    const b=document.getElementById("go");b.disabled=true;
    try{
      const res=await rpc("start_attempt",{p_code:code});
      token=res.token;try{localStorage.setItem("giotrade_token",token)}catch(e){}
      renderState(res.state);
    }catch(e){document.getElementById("err").textContent=e.message;b.disabled=false}
  };
  document.getElementById("go").onclick=go;
  document.getElementById("code").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
}
function viewIntro(sec,st){
  clearTimers();
  const m=META[sec],first=sec==="a";
  const done=SEC_ORDER.filter(s=>st[s].status==="done").map(s=>META[s].title.split(":")[0]);
  $app.innerHTML=`<main>
  <h1>Hello ${esc(st.name)}</h1><p class="sub">Giotrade Group · Structure, Premium/Discount &amp; Volume</p>
  ${done.length?`<div class="card"><b>${done.join(", ")}</b> ${done.length>1?"are":"is"} complete and locked.</div>`:""}
  <div class="card">
    <h2>${esc(m.title)}</h2>
    <p class="muted">${esc(m.info)}</p>
    <table><tr><td>Time for this section</td><td><b>${m.mins} minutes</b></td></tr>
    <tr><td>Total test</td><td>20 + 25 + 20 = 65 minutes</td></tr></table>
    <ul>
      <li>The timer starts the moment you press <b>Start</b>.</li>
      <li>Your answers save automatically as you work.</li>
      <li>When time runs out the section locks and you cannot go back.</li>
      <li>You can submit early if you are finished.</li>
    </ul>
    ${first?`<div class="card reminder"><b>Helpful reminder:</b> Equilibrium = (Range High + Range Low) ÷ 2. Above it is premium, below it is discount. In Section B your best 7 of 8 answers count.</div>`:""}
    <p><button id="start">Start ${esc(m.title.split(":")[0])}</button></p>
    <p class="err" id="err"></p>
  </div></main>`;
  document.getElementById("start").onclick=async()=>{
    const b=document.getElementById("start");b.disabled=true;
    try{renderState(await rpc("start_section",{p_token:token,p_section:sec}))}
    catch(e){document.getElementById("err").textContent=e.message;b.disabled=false}
  };
}
function viewDone(st){
  clearTimers();
  try{localStorage.removeItem("giotrade_token")}catch(e){}
  $app.innerHTML=`<main><h1>Assessment complete</h1><p class="sub">Giotrade Group</p>
  <div class="card"><h2>Thank you${st&&st.name?", "+esc(st.name):""}.</h2>
  <p>All three sections are submitted and locked. Your tutor will mark your written answers and share your results.</p>
  <p class="muted">You can now close this page.</p></div></main>`;
}

/* ---------- exam ---------- */
function field(id,rows){return `<textarea data-id="${id}" rows="${rows}" aria-label="Answer ${id}"></textarea>`}
function renderExam(sec,remaining,saved){
  clearTimers();cur=sec;answers=Object.assign({},saved||{});closing=false;
  deadline=performance.now()+remaining*1000;
  let body="";
  if(sec==="a"){
    body=A.map(q=>`<fieldset>${q.img?`<img class="fig" src="img/${q.img}" alt="${esc(q.alt)}">`:""}
      <legend>A${q.n}. ${esc(q.q)}</legend>
      ${q.o.map((o,i)=>`<label class="opt"><input type="radio" name="A${q.n}" value="${"ABCD"[i]}"><span><b>${"ABCD"[i]})</b> ${esc(o)}</span></label>`).join("")}
    </fieldset>`).join("");
  }else if(sec==="b"){
    body=B.map(q=>`<div class="q"><p><b>${q.t}</b> ${esc(q.q)} <span class="marks">(${q.m} marks)</span></p>
      ${q.p.map(p=>`${p.s?`<p class="part">${esc(p.s)}</p>`:""}${field(p.id,p.r)}`).join("")}</div>`).join("");
  }else{
    body=C.map(q=>`<div class="q"><p><b>${esc(q.t)}</b> ${esc(q.q)}</p>
      ${q.p.map(p=>`${p.s?`<p class="part">${esc(p.s)}</p>`:""}${field(p.id,p.r)}`).join("")}</div>`).join("");
  }
  $app.innerHTML=`<div class="bar"><div><b>${esc(META[sec].title)}</b><div class="status" id="st">Answers save automatically</div></div>
    <div class="t" id="tm">${mmss(remaining)}</div></div>
  <main>${body}
  <p><button id="sub">Submit ${esc(META[sec].title.split(":")[0])}</button></p><p class="err" id="err"></p></main>`;
  // fill saved answers
  $app.querySelectorAll("input[type=radio]").forEach(r=>{if(answers[r.name]===r.value)r.checked=true});
  $app.querySelectorAll("textarea").forEach(t=>{t.value=answers[t.dataset.id]||""});
  $app.addEventListener("input",onChange);$app.addEventListener("change",onChange);
  document.getElementById("sub").onclick=()=>{
    if(confirm("Submit this section now? You will not be able to come back to it."))save(true);
  };
  tick=setInterval(()=>{
    const left=(deadline-performance.now())/1000;
    const el=document.getElementById("tm");if(!el)return;
    el.textContent=mmss(left);
    el.className="t"+(left<=60?" crit":left<=300?" warn":"");
    if(left<=0&&!closing){closing=true;save(true)}
  },250);
  auto=setInterval(()=>{if(!closing)save(false)},15000);
}
function onChange(e){
  const t=e.target;
  if(t.matches("input[type=radio]"))answers[t.name]=t.value;
  else if(t.matches("textarea"))answers[t.dataset.id]=t.value;
  else return;
  setSt("Saving…");clearTimeout(debounce);debounce=setTimeout(()=>save(false),1500);
}
function setSt(s){const el=document.getElementById("st");if(el)el.textContent=s}
async function save(submit){
  while(saving)await sleep(150);
  saving=true;
  try{
    const sec=cur;
    const st=await rpc("save_answers",{p_token:token,p_section:sec,p_answers:answers,p_submit:!!submit});
    if(st[sec].status==="running"&&!submit){
      deadline=performance.now()+st[sec].remaining*1000;setSt("Saved "+new Date().toLocaleTimeString([], {hour:"2-digit",minute:"2-digit",second:"2-digit"}));
    }else{saving=false;$app.removeEventListener("input",onChange);$app.removeEventListener("change",onChange);renderState(st);return}
  }catch(e){
    if(/closed/i.test(e.message)){saving=false;try{renderState(await rpc("get_state",{p_token:token}))}catch(_){}return}
    setSt("Could not save. Check your internet. Retrying…");
    if(submit){saving=false;await sleep(2000);return save(true)}
  }
  saving=false;
}

/* ---------- router ---------- */
function renderState(st){
  clearTimers();
  $app.removeEventListener("input",onChange);$app.removeEventListener("change",onChange);
  if(st.finished){viewDone(st);return}
  for(const s of SEC_ORDER){
    if(st[s].status==="running"){renderExam(s,st[s].remaining,st[s].answers);return}
    if(st[s].status==="ready"){viewIntro(s,st);return}
  }
  viewDone(st);
}
(async function init(){
  if(/PASTE_YOUR/.test(SUPABASE_URL)||/PASTE_YOUR/.test(SUPABASE_KEY)){viewSetup();return}
  if(token){
    try{renderState(await rpc("get_state",{p_token:token}));return}
    catch(e){try{localStorage.removeItem("giotrade_token")}catch(_){};token=null}
  }
  viewLogin();
})();
</script>
</body>
</html>
